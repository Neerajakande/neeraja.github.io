<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Food Menu</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  display: flex;
}

/* Sidebar */
.sidebar {
  background: #ff9800;
  color: white;
  padding: 20px;
  width: 200px;
}

/* Main */
.main {
  flex: 1;
  padding: 20px;
}

/* Menu */
.menu-container {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
}

.menu-item {
  width: 220px;
  border: 1px solid #ddd;
  border-radius: 5px;
}

.menu-item img {
  width: 100%;
  height: 140px;
}

.menu-content {
  padding: 10px;
}

/* Cart */
.cart {
  position: fixed;
  right: 0;
  top: 0;
  width: 250px;
  height: 100%;
  background: #f5f5f5;
  padding: 15px;
  border-left: 2px solid #ccc;
}

button {
  margin-top: 5px;
  padding: 5px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>🍽 Menu</h2>
</div>

<div class="main">
  <h1>Food Menu</h1>

  <div class="menu-container">

    <div class="menu-item">
      <img src="pizza.png">
      <div class="menu-content">
        <h3>Pizza</h3>
        <p>₹199</p>
        <button onclick="addToCart('Pizza',199)">Add</button>
      </div>
    </div>

    <div class="menu-item">
      <img src="burger.png">
      <div class="menu-content">
        <h3>Burger</h3>
        <p>₹149</p>
        <button onclick="addToCart('Burger',149)">Add</button>
      </div>
    </div>

    <div class="menu-item">
      <img src="biryani.png">
      <div class="menu-content">
        <h3>Biryani</h3>
        <p>₹179</p>
        <button onclick="addToCart('Biryani',179)">Add</button>
      </div>
    </div>

  </div>
</div>

<!-- Cart -->
<div class="cart">
  <h3>🛒 Cart</h3>
  <ul id="cartItems"></ul>
  <h4>Total: ₹<span id="total">0</span></h4>
  <button onclick="checkout()">Checkout</button>
</div>

<script>
let cart = [];
let total = 0;

function addToCart(name, price) {
  cart.push({name, price});
  total += price;

  updateCart();
}

function updateCart() {
  let list = document.getElementById("cartItems");
  list.innerHTML = "";

  cart.forEach(item => {
    let li = document.createElement("li");
    li.innerText = item.name + " - ₹" + item.price;
    list.appendChild(li);
  });

  document.getElementById("total").innerText = total;
}

function checkout() {
  if(cart.length === 0) {
    alert("Cart is empty!");
  } else {
    alert("Order placed! Total: ₹" + total);
    cart = [];
    total = 0;
    updateCart();
  }
}
</script>

</body>
</html>
